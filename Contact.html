    <h2>Contact Details</h2>

    <p><b>Restaurant:</b> Food Corner</p>
    <p><b>Address:</b> Main Road, Pune, Maharashtra</p>
    <p><b>Mobile:</b> 9876543210</p>

    <h2>Table Reservation</h2>

    <form>

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter name" required>
        <br><br>

        <label>Mobile:</label>
        <input type="tel" name="mobile" placeholder="Enter no" required>
        <br><br>

        <label>Number of Persons:</label>
        <input type="number" name="persons" placeholder="Enter Persons" required>
        <br><br>

        <label>Date:</label>
        <input type="date" name="date" required>
        <br><br>

        <label>Food Preference:</label>
        <br>

        <input type="radio" name="food" value="veg">
        Vegetarian

        <input type="radio" name="food" value="nonveg">
        Non-Vegetarian

        <br><br>

        <input type="submit" value="Reserve Table">

    </form>
